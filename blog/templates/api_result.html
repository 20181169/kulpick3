<html>
	{% load static %}
	<head>
		<title>Eventually by HTML5 UP</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="stylesheet" href="{% static "blog/assets/css/main.css" %}" />
		<style>
			/* 페이지 전체를 높이와 수직 가운데 정렬하는 스타일 */
			html, body {
				height: 100%;
				margin: 0;
				display: flex;
				flex-direction: column;
				justify-content: center;
				align-items: center;
			}
		
			/* 커스텀 디자인을 적용하기 위한 스타일 */
			.custom-file-input {
				display: none; /* 기본 파일 업로드 버튼을 숨김 */
			}
		
			.custom-file-label {
				background-color: #ff00ff;
				color: #fff;
				padding: 10px 20px;
				border-radius: 5px;
				cursor: pointer;
				width: 150px; /* 버튼의 너비를 조절하세요 */
			}
		
			.button-container {
				display: flex;
				justify-content: center;
				align-items: center;
				margin-top: 10px;
			}
		
			.button-container button {
				margin: 0 10px; /* 버튼 사이의 간격을 조절하세요 */
				padding: 10px 20px;
				border: none;
				border-radius: 5px;
				cursor: pointer;
			}
		
			.button-container #retake-button {
				background-color: #00ff00; /* 다시 촬영 버튼 색상 */
				color: black;
			}
		
			.button-container #upload-button {
				background-color: #ff0000; /* 업로드 버튼 색상 */
				color: black;
			}

			.fancy-button {
				background-color: #ff00ff;
				color: #fff;
				padding: 10px 20px;
				border: none;
				border-radius: 5px;
				cursor: pointer;
				font-size: 16px;
				transition: background-color 0.3s ease, color 0.3s ease;
			}

			.fancy-button:hover {
				background-color: #ff3399; /* 마우스 호버 시 색상 변경 */
			}
		</style>
	</head>
	</html>

	</head>
	<body class="is-preload">

		<!-- Header -->
			<header id="header" style="text-align: center;">
				<h1>메뉴판 등록</h1>
				<p>하세요 <!--<a href="http://html5up.net">링크</a>.--></p>
                {% for item in menu %}
                    <label for="product-{{ forloop.counter }}">제품 이름: {{ item.productName }}</label>
                    <select id="product-{{ forloop.counter }}" name="product_{{ forloop.counter }}">
                        {% for option_item in menu %}
                            <option value="{{ option_item.price }}" {% if forloop.counter == forloop.parentloop.counter %}selected{% endif %}>
                                {{ option_item.price }}
                            </option>
                        {% endfor %}
                    </select>
                    <br>
                {% endfor %}
                      
                </ul>
			</header>

        <!-- Signup Form -->
		<form method="post" action="{% url 'take_picture' %}" enctype="multipart/form-data" style="text-align: center;">

		</form>

		

		<!-- Footer -->
			<footer id="footer">
				<ul class="icons">
					<li><a href="#" class="icon brands fa-twitter"><span class="label">Twitter</span></a></li>
					<li><a href="#" class="icon brands fa-instagram"><span class="label">Instagram</span></a></li>
					<li><a href="#" class="icon brands fa-github"><span class="label">GitHub</span></a></li>
					<li><a href="#" class="icon fa-envelope"><span class="label">Email</span></a></li>
				</ul>
				<ul class="copyright">
					<li>&copy; Untitled.</li><li>Credits: <a href="http://html5up.net">HTML5 UP</a></li>
				</ul>
			</footer>

		<!-- Scripts -->
			<script src="{% static "blog/assets/js/main.js" %}"></script>

	</body>
	<script>
		function previewImage(input) {
			var preview = document.getElementById('preview-image');
			var retakeButton = document.getElementById('retake-button');
			var uploadButton = document.getElementById('upload-button');
			var uploadLabel = document.querySelector('label[for="camera-input"]');

			if (input.files && input.files[0]) {
				var reader = new FileReader();

				reader.onload = function (e) {
					preview.src = e.target.result;
					preview.style.display = 'block';
					uploadLabel.style.display = 'none';
					retakeButton.style.display = 'block'; // 이미지가 선택되면 "다시 촬영" 버튼을 표시합니다.
					uploadButton.style.display = 'block'; // 이미지가 선택되면 "업로드" 버튼을 표시합니다.
				};

				reader.readAsDataURL(input.files[0]);
			}
		}

		// "다시 촬영" 버튼을 클릭했을 때 input 필드를 리셋합니다.
		document.getElementById('retake-button').addEventListener('click', function () {
			var input = document.getElementById('camera-input');
			input.value = ''; // input 필드 초기화
			var preview = document.getElementById('preview-image');
			preview.style.display = 'none'; // 이미지 미리 보기 숨기기
			var uploadLabel = document.querySelector('label[for="camera-input"]');
			var retakeButton = document.getElementById('retake-button');
			var uploadButton = document.getElementById('upload-button');
			uploadLabel.style.display = 'block';
			retakeButton.style.display = 'none'; // "다시 촬영" 버튼 숨기기
			uploadButton.style.display = 'none'; // "업로드" 버튼 숨기기
		});
	</script>
</html>
