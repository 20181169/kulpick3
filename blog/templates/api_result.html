<html>
	{% load static %}
	<head>
		<title>Eventually by HTML5 UP</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="stylesheet" href="{% static "blog/assets/css/main.css" %}" />
		<style>
			/* 페이지 전체를 높이와 수직 가운데 정렬하는 스타일 */
			html, body {
				height: 100%;
				margin: 0;
				display: flex;
				flex-direction: column;
				justify-content: center;
				align-items: center;
			}
		
			/* 커스텀 디자인을 적용하기 위한 스타일 */
			.custom-file-input {
				display: none; /* 기본 파일 업로드 버튼을 숨김 */
			}
		
			.custom-file-label {
				background-color: #ff00ff;
				color: #fff;
				padding: 10px 20px;
				border-radius: 5px;
				cursor: pointer;
				width: 150px; /* 버튼의 너비를 조절하세요 */
			}
		
			.button-container {
				display: flex;
				justify-content: center;
				align-items: center;
				margin-top: 10px;
			}
		
			.button-container button {
				margin: 0 10px; /* 버튼 사이의 간격을 조절하세요 */
				padding: 10px 20px;
				border: none;
				border-radius: 5px;
				cursor: pointer;
			}
		
			.button-container #retake-button {
				background-color: #00ff00; /* 다시 촬영 버튼 색상 */
				color: black;
			}
		
			.button-container #upload-button {
				background-color: #ff0000; /* 업로드 버튼 색상 */
				color: black;
			}

			.fancy-button {
				background-color: #ff00ff;
				color: #fff;
				padding: 10px 20px;
				border: none;
				border-radius: 5px;
				cursor: pointer;
				font-size: 16px;
				transition: background-color 0.3s ease, color 0.3s ease;
			}

			.fancy-button:hover {
				background-color: #ff3399; /* 마우스 호버 시 색상 변경 */
			}

			.scrollable-container {
            max-height: 500px; /* 스크롤 가능한 컨테이너의 최대 높이 설정 */
            overflow-y: auto; /* 세로 스크롤 바 표시 */
            border: 1px solid #ccc; /* 테두리 추가 (선택사항) */
            padding: 10px; /* 여백 추가 (선택사항) */
			width: 500px;
        	}
			.select-pair {
				display: flex;
				align-items: center;
				margin-bottom: 20px;
			}

			.select-pair select {
				font-size: 12px;
				padding: 5px;
				margin-right: 10px;
			}
			.input-field {
				width: 150px; /* 원하는 너비로 설정 */
				padding: 10px; /* 원하는 패딩값으로 설정 */
				font-size: 16px; /* 원하는 글꼴 크기로 설정 */
				border-radius: 5px; /* 원하는 테두리 반경으로 설정 */
				border: 1px solid #ccc; /* 테두리 스타일 설정 (선택사항) */
				/* 추가적인 스타일링을 필요에 따라 적용하세요 */
			}
		</style>
	</head>
	</html>

	</head>
	<body class="is-preload">

		<!-- Header -->
		<header id="header" style="text-align: center;">
			<form method="post" action="{% url 'upload_product' %}">
				{% csrf_token %}  
				<div class="scrollable-container">
					{% for item in menu %}
						<div class="select-pair">
							<input type="text" id="product-{{ forloop.counter }}" name="product_{{ forloop.counter }}"
								value="{{ item.productName }}"
								{% if forloop.counter == forloop.parentloop.counter %}selected{% endif %}
								class="input-field"> <!-- input 요소에 클래스 추가 -->

							<input type="text" id="product-{{ forloop.counter }}" name="product_{{ forloop.counter }}"
							value="{{ item.price}}"
							{% if forloop.counter == forloop.parentloop.counter %}selected{% endif %}
							class="input-field">
						</div>
					{% endfor %}
				</div>
				<button type="submit" class="text-white bg-gradient-to-br from-pink-500 to-orange-400 hover:bg-gradient-to-bl focus:ring-4 focus:outline-none focus:ring-pink-200 dark:focus:ring-pink-800 font-medium rounded-lg text-sm px-5 py-2.5 text-center mr-2 mb-2" style="padding: 30px 60px; display: flex; align-items: center; position: fixed; left: 47%; ">제출하기</button>
			</form>
		</header>

        <!-- Signup Form -->
		<form method="post" action="{% url 'take_picture' %}" enctype="multipart/form-data" style="text-align: center;">

		</form>

		

		<!-- Footer -->
			<footer id="footer">
				<ul class="icons">
					<li><a href="#" class="icon brands fa-twitter"><span class="label">Twitter</span></a></li>
					<li><a href="#" class="icon brands fa-instagram"><span class="label">Instagram</span></a></li>
					<li><a href="#" class="icon brands fa-github"><span class="label">GitHub</span></a></li>
					<li><a href="#" class="icon fa-envelope"><span class="label">Email</span></a></li>
				</ul>
				<ul class="copyright">
					<li>&copy; Untitled.</li><li>Credits: <a href="http://html5up.net">HTML5 UP</a></li>
				</ul>
			</footer>

		<!-- Scripts -->
			<script src="{% static "blog/assets/js/main.js" %}"></script>

	</body>
	<script>
		function previewImage(input) {
			var preview = document.getElementById('preview-image');
			var retakeButton = document.getElementById('retake-button');
			var uploadButton = document.getElementById('upload-button');
			var uploadLabel = document.querySelector('label[for="camera-input"]');

			if (input.files && input.files[0]) {
				var reader = new FileReader();

				reader.onload = function (e) {
					preview.src = e.target.result;
					preview.style.display = 'block';
					uploadLabel.style.display = 'none';
					retakeButton.style.display = 'block'; // 이미지가 선택되면 "다시 촬영" 버튼을 표시합니다.
					uploadButton.style.display = 'block'; // 이미지가 선택되면 "업로드" 버튼을 표시합니다.
				};

				reader.readAsDataURL(input.files[0]);
			}
		}

		// "다시 촬영" 버튼을 클릭했을 때 input 필드를 리셋합니다.
		document.getElementById('retake-button').addEventListener('click', function () {
			var input = document.getElementById('camera-input');
			input.value = ''; // input 필드 초기화
			var preview = document.getElementById('preview-image');
			preview.style.display = 'none'; // 이미지 미리 보기 숨기기
			var uploadLabel = document.querySelector('label[for="camera-input"]');
			var retakeButton = document.getElementById('retake-button');
			var uploadButton = document.getElementById('upload-button');
			uploadLabel.style.display = 'block';
			retakeButton.style.display = 'none'; // "다시 촬영" 버튼 숨기기
			uploadButton.style.display = 'none'; // "업로드" 버튼 숨기기
		});
	</script>
</html>
