<!DOCTYPE html>
<html lang="ko">
<head>
  {% load static %}
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>꿀픽 매장관리</title>
  <script
  src="https://code.jquery.com/jquery-3.7.1.min.js"
  integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
  crossorigin="anonymous"></script>
  <link rel="stylesheet" href="{% static "blog/assets/css/store.css" %}" />
</head>
<body>
  <div class="top">
    <h1>특가상품목록</h1>
    <div class="util">
      <a href="#" class="hamburger">  
        <span></span>
        <span></span>
        <span></span>
      </a>
    </div>
    <div class="gnb_list">
      <ul>
        <li><a href="select_store">매장선택(home)</a></li>
        <li><a href="homepage_views_afterLogin">메뉴관리</a></li>
        <li><a href="#">특가상품관리</a></li>
      </ul>
    </div>
  </div>
  <div class="cont special_pd">
    <div class="menu_list">
      <ul>
        <li>
          <div class="img_box">
            {% if product_image %}
              <img src="{{ product_image }}" alt="thumbnail">
            {% else %}
              <!-- 값이 없을 때 기본 이미지를 표시 -->
              <img src="{% static "blog/images/bg06.jpg" %}" alt="thumbnail">
            {% endif %}
          </div>
          <div class="info">
            <p>{{ product_name }}</p>
            <p>{{ product_price }}원 </p>
          </div>
        </li>
      </ul>
    </div>
    <div class="special_box">
      <table>
        <form method="post" action="{% url 'speacial_result' %}">
          {% csrf_token %} 
          <tr>
            <th>시작시간</th>
            <td colspan="2">
              <select name="start_time" id="start_time_input">
                <option value="00:00">00:00</option>
                <option value="01:00">01:00</option>
                <option value="02:00">02:00</option>
                <option value="03:00">03:00</option>
                <option value="04:00">04:00</option>
                <option value="05:00">05:00</option>
                <option value="06:00">06:00</option>
                <option value="07:00">07:00</option>
                <option value="08:00">08:00</option>
                <option value="09:00">09:00</option>
                <option value="10:00">10:00</option>
                <option value="11:00">11:00</option>
                <option value="12:00">12:00</option>
                <option value="13:00">13:00</option>
                <option value="14:00">14:00</option>
                <option value="15:00">15:00</option>
                <option value="16:00">16:00</option>
                <option value="17:00">17:00</option>
                <option value="18:00">18:00</option>
                <option value="19:00">19:00</option>
                <option value="20:00">20:00</option>
                <option value="21:00">21:00</option>
                <option value="22:00">22:00</option>
                <option value="23:00">23:00</option>
                <option value="24:00">24:00</option>
              </select>
            </td>
          </tr>
          <tr>
            <th>마감시간</th>
            <td colspan="2">
              <select name="end_time" id="end_time_input">
                <option value="00:00">00:00</option>
                <option value="01:00">01:00</option>
                <option value="02:00">02:00</option>
                <option value="03:00">03:00</option>
                <option value="04:00">04:00</option>
                <option value="05:00">05:00</option>
                <option value="06:00">06:00</option>
                <option value="07:00">07:00</option>
                <option value="08:00">08:00</option>
                <option value="09:00">09:00</option>
                <option value="10:00">10:00</option>
                <option value="11:00">11:00</option>
                <option value="12:00">12:00</option>
                <option value="13:00">13:00</option>
                <option value="14:00">14:00</option>
                <option value="15:00">15:00</option>
                <option value="16:00">16:00</option>
                <option value="17:00">17:00</option>
                <option value="18:00">18:00</option>
                <option value="19:00">19:00</option>
                <option value="20:00">20:00</option>
                <option value="21:00">21:00</option>
                <option value="22:00">22:00</option>
                <option value="23:00">23:00</option>
                <option value="24:00">24:00</option>
              </select>
            </td>
          </tr>
            <th>할인</th>
            <td>추천할인율 계산</td>
            <td rowspan="2" class="ai"><button class="ai_btn" type="submit">AI 추천<br>받기</button></td>
          </tr>
        </form>      
        <tr>
          <th>개수</th>
          <td>추천판매수량 계산</td>          
        </tr>
        <tr>
          <th>설명</th>
          <td colspan="2">특가상품등록 설명입니다.</td>
        </tr>
      </table>
    </div>
    <div class="btn">
      <a href="#">특가 상품 등록</a>
    </div>
  </div>

  <script>
    var burger = $('.hamburger');

    burger.each(function(index){
      var $this = $(this);
      
      $this.on('click', function(e){
        e.preventDefault();
        $(this).toggleClass('active-' + (index+1));
        $(".gnb_list").toggleClass("on");
        $("body").toggleClass("overlay");
      })
    });
  </script>
</body>
</html>

<div class="gnb_list">
  <ul>
    <li><a href="select_store">매장선택(home)</a></li>
    <li><a href="homepage_views_afterLogin">메뉴관리</a></li>
    <li><a href="#">특가상품관리</a></li>
  </ul>
</div>
